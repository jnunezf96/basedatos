name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate scripts
        run: |
          python3 -m py_compile resources/build_lazy_data_assets.py resources/build_bootstrap.py
          node --check search-worker.js
          node --check pair-worker.js
          node --check study-core.js
          node --check study-worker.js
          node --check resources/benchmark_static_share_url.mjs

      - name: Check reviewed source alignment
        run: |
          python3 resources/repair_sahagun_internal_coherence_exact_overrides.py --record-id 1565-sahagun-escolios:000774 --check --proposals /tmp/sahagun-alignment-check.tsv --summary /tmp/sahagun-alignment-check.json

      - name: Check reviewed Escolios numbering cycles
        run: python3 resources/repair_sahagun_internal_coherence_exact_overrides.py --check --record-id 1565-sahagun-escolios:000318 --record-id 1565-sahagun-escolios:000321 --record-id 1565-sahagun-escolios:000411 --record-id 1565-sahagun-escolios:000490 --record-id 1565-sahagun-escolios:000501 --proposals /tmp/sahagun-five-check.tsv --summary /tmp/sahagun-five-check.json
      - name: Check reviewed Wimmer terminal markup
        run: python3 resources/repair_wimmer_terminal_html.py --check --report /tmp/wimmer-terminal-check.json

      - name: Check reviewed Wimmer Spanish terminal markup
        run: python3 resources/repair_wimmer_terminal_html.py --scope-report resources/wimmer_spanish_nine_2026_09_20_scope.json --check
      - name: Build and verify static bootstrap
        run: |
          python3 resources/build_bootstrap.py
          python3 resources/build_bootstrap.py --check

      - name: Build static lazy assets
        run: python3 resources/build_lazy_data_assets.py

      - name: Assemble static site
        run: |
          mkdir -p _site/data
          cp index.html style.css data.js filters.js script.js search-worker.js pair-worker.js study-core.js study-worker.js sw.js manifest.json icon.svg _site/
          cp data/bootstrap.js data/data.jsonl.gz _site/data/
          cp -R data/lazy _site/data/lazy

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
